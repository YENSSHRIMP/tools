<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白蝦採購工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ocean-deep:#0B4F6C;
  --ocean-teal:#01949A;
  --ocean-foam:#5FC9BF;
  --sand:#FBF5E6;
  --sand-dark:#F2E9D2;
  --coral:#FF6B5B;
  --coral-dark:#E05445;
  --ink:#0A2E36;
  --ink-soft:#3D5A60;
  --white:#FFFFFF;
  --line:#D8E6E2;
  --shadow:0 4px 14px rgba(11,79,108,0.10);
  --shadow-lift:0 10px 28px rgba(11,79,108,0.16);
  --radius:14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--sand);
  color:var(--ink);
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 800px 400px at 10% -5%, rgba(95,201,191,0.18), transparent),
    radial-gradient(ellipse 600px 500px at 95% 10%, rgba(1,148,154,0.10), transparent);
}

.shell{
  display:flex;
  min-height:100vh;
}

/* ---------- Sidebar (desktop) ---------- */
.sidebar{
  width:248px;
  flex-shrink:0;
  background:linear-gradient(180deg,var(--ocean-deep),#073A50);
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  gap:22px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.sb-brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 6px;
}
.sb-brand-mark{
  width:42px;height:42px;
  border-radius:11px;
  background:rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sb-brand-mark svg{width:24px;height:24px;}
.sb-brand-text h1{
  font-family:'Archivo Expanded',sans-serif;
  font-weight:800;
  font-size:1.05rem;
  color:var(--white);
  margin:0;
  line-height:1.25;
}
.sb-brand-text p{
  margin:2px 0 0;
  font-size:0.66rem;
  color:rgba(255,255,255,0.55);
  letter-spacing:0.04em;
}

.sb-fx-badge{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.08);
  border-radius:10px;
  padding:9px 12px;
  font-size:0.72rem;
  color:rgba(255,255,255,0.85);
  font-family:'JetBrains Mono',monospace;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;
  background:#2ecc71;
  box-shadow:0 0 0 0 rgba(46,204,113,0.6);
  animation:pulse 2s infinite;
  flex-shrink:0;
}
.live-dot.off{background:#cfcfcf;animation:none;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(46,204,113,0.5);}
  70%{box-shadow:0 0 0 6px rgba(46,204,113,0);}
  100%{box-shadow:0 0 0 0 rgba(46,204,113,0);}
}

.sb-nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.sb-tab-btn{
  display:flex;
  align-items:center;
  gap:10px;
  background:transparent;
  border:none;
  border-radius:10px;
  padding:11px 12px;
  font-family:'Noto Sans TC',sans-serif;
  font-weight:600;
  font-size:0.88rem;
  color:rgba(255,255,255,0.72);
  cursor:pointer;
  text-align:left;
  transition:all .15s ease;
}
.sb-tab-btn .tab-num{
  font-family:'JetBrains Mono',monospace;
  font-size:0.68rem;
  color:rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.08);
  border-radius:5px;
  padding:1px 6px;
  flex-shrink:0;
}
.sb-tab-btn:hover{
  background:rgba(255,255,255,0.06);
  color:var(--white);
}
.sb-tab-btn.active{
  background:rgba(255,255,255,0.14);
  color:var(--white);
  box-shadow:inset 3px 0 0 var(--coral);
}
.sb-tab-btn.active .tab-num{
  background:var(--coral);
  color:var(--white);
}

.sb-footer-note{
  margin-top:auto;
  font-size:0.66rem;
  color:rgba(255,255,255,0.4);
  padding:0 6px;
  line-height:1.5;
}

/* ---------- Mobile top bar ---------- */
.mobile-topbar{
  display:none;
}

/* ---------- Main content ---------- */
.main-wrap{
  flex:1;
  min-width:0;
  padding:28px 32px 60px;
  max-width:980px;
}

@media(max-width:880px){
  .shell{flex-direction:column;}
  .sidebar{display:none;}
  .mobile-topbar{
    display:block;
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(180deg,var(--ocean-deep),#0B4F6C);
    padding:14px 16px 10px;
  }
  .mt-brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .mt-brand-left{display:flex;align-items:center;gap:10px;}
  .mt-brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
  }
  .mt-brand-mark svg{width:20px;height:20px;}
  .mt-brand-text h1{
    font-family:'Archivo Expanded',sans-serif;
    font-weight:800;
    font-size:0.78rem;
    color:var(--white);
    margin:0;
    white-space:nowrap;
  }
  .mt-fx-badge{
    display:flex;align-items:center;gap:5px;
    background:rgba(255,255,255,0.1);
    border-radius:999px;
    padding:4px 8px;
    font-size:0.6rem;
    color:rgba(255,255,255,0.85);
    font-family:'JetBrains Mono',monospace;
    white-space:nowrap;
    max-width:110px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .mt-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:thin;
  }
  .mt-tab-btn{
    flex:0 0 auto;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.08);
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:600;
    font-size:0.78rem;
    color:rgba(255,255,255,0.75);
    cursor:pointer;
  }
  .mt-tab-btn .tab-num{
    font-family:'JetBrains Mono',monospace;
    font-size:0.65rem;
    opacity:0.7;
  }
  .mt-tab-btn.active{
    background:var(--coral);
    color:var(--white);
  }
  .main-wrap{
    padding:20px 16px 50px;
    max-width:100%;
  }
}

/* ---------- Panels ---------- */
.panel{display:none;animation:fadeIn .25s ease;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.panel-head{margin-bottom:18px;}
.panel-head h2{
  font-family:'Archivo Expanded',sans-serif;
  font-weight:700;
  font-size:1.35rem;
  color:var(--ocean-deep);
  margin:0 0 4px;
}
.panel-head p{
  margin:0;
  color:var(--ink-soft);
  font-size:0.92rem;
}

.card{
  background:var(--white);
  border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:20px;
}
.card-title{
  font-weight:700;
  font-size:1rem;
  color:var(--ocean-deep);
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card-title .dot{width:7px;height:7px;border-radius:50%;background:var(--coral);}

/* formula tag */
.formula-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:0.82rem;
  color:var(--ocean-deep);
  background:var(--sand-dark);
  border:1.5px dashed var(--ocean-foam);
  border-radius:8px;
  padding:10px 14px;
  margin-bottom:18px;
  line-height:1.6;
  overflow-x:auto;
}
.formula-tag b{color:var(--coral-dark);}
.formula-tag .fname{
  display:inline-block;
  font-family:'Noto Sans TC',sans-serif;
  font-weight:700;
  font-size:0.72rem;
  color:var(--white);
  background:var(--ocean-teal);
  border-radius:5px;
  padding:1px 8px;
  margin-bottom:6px;
}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:680px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{
  font-size:0.82rem;
  font-weight:600;
  color:var(--ink-soft);
}
.field .hint{font-size:0.72rem;color:#8AA0A4;font-weight:400;}
.field input[type=number],
.field input[type=text],
.field select{
  font-family:'JetBrains Mono',monospace;
  font-size:0.95rem;
  padding:10px 12px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:var(--sand);
  color:var(--ink);
  transition:border-color .15s;
  width:100%;
}
.field input:focus,.field select:focus{
  outline:none;
  border-color:var(--ocean-teal);
  background:var(--white);
}
.radio-row{display:flex;gap:10px;flex-wrap:wrap;}
.radio-chip{
  flex:1;
  text-align:center;
  border:1.5px solid var(--line);
  border-radius:8px;
  padding:9px 10px;
  font-size:0.85rem;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  background:var(--sand);
  transition:all .15s;
}
.radio-chip input{display:none;}
.radio-chip.checked{
  background:var(--ocean-teal);
  border-color:var(--ocean-teal);
  color:var(--white);
}

.result-box{
  margin-top:6px;
  background:linear-gradient(135deg,rgba(1,148,154,0.07),rgba(95,201,191,0.12));
  border:1px solid var(--ocean-foam);
  border-radius:10px;
  padding:16px 18px;
}
.result-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:6px 0;
  border-bottom:1px dashed rgba(11,79,108,0.12);
}
.result-row:last-child{border-bottom:none;}
.result-row .rlabel{font-size:0.84rem;color:var(--ink-soft);}
.result-row .rvalue{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:1.05rem;
  color:var(--ocean-deep);
}
.result-row .rvalue.big{font-size:1.4rem;color:var(--coral-dark);}
.result-row .rvalue.muted{font-size:0.9rem;color:var(--ink-soft);font-weight:500;}

.note-line{
  font-size:0.76rem;
  color:#8AA0A4;
  margin-top:10px;
}

button.calc-btn{
  font-family:'Noto Sans TC',sans-serif;
  font-weight:700;
  font-size:0.9rem;
  color:var(--white);
  background:linear-gradient(135deg,var(--coral),var(--coral-dark));
  border:none;
  border-radius:9px;
  padding:11px 20px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(255,107,91,0.32);
  transition:transform .15s, box-shadow .15s;
}
button.calc-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,107,91,0.4);}
button.calc-btn:active{transform:translateY(0);}
button.ghost-btn{
  font-family:'Noto Sans TC',sans-serif;
  font-weight:600;
  font-size:0.84rem;
  color:var(--ocean-teal);
  background:transparent;
  border:1.5px solid var(--ocean-foam);
  border-radius:9px;
  padding:9px 16px;
  cursor:pointer;
  transition:background .15s;
}
button.ghost-btn:hover{background:rgba(95,201,191,0.12);}

/* table */
table.spec-table{
  width:100%;
  border-collapse:collapse;
  font-size:0.86rem;
}
table.spec-table th{
  text-align:left;
  font-size:0.74rem;
  color:var(--white);
  background:var(--ocean-deep);
  padding:9px 10px;
  position:sticky;top:0;
}
table.spec-table th:first-child{border-radius:8px 0 0 0;}
table.spec-table th:last-child{border-radius:0 8px 0 0;}
table.spec-table td{
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;
}
table.spec-table tr:hover td{background:rgba(95,201,191,0.08);}
table.spec-table td.label-cell{
  font-family:'Noto Sans TC',sans-serif;
  font-weight:700;
  color:var(--ocean-deep);
}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}

.tag-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{
  font-size:0.72rem;
  font-family:'JetBrains Mono',monospace;
  background:var(--sand-dark);
  color:var(--ink-soft);
  border-radius:5px;
  padding:3px 8px;
}

.footer-note{
  text-align:center;
  font-size:0.76rem;
  color:#8AA0A4;
  margin-top:30px;
}

.two-col-tools{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:780px){.two-col-tools{grid-template-columns:1fr;}}

.sub-tabs{display:flex;gap:8px;margin-bottom:16px;}
.sub-tab-btn{
  flex:1;
  border:1.5px solid var(--line);
  background:var(--sand);
  border-radius:9px;
  padding:9px;
  font-size:0.82rem;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
}
.sub-tab-btn.active{
  background:var(--ocean-teal);
  border-color:var(--ocean-teal);
  color:var(--white);
}
.sub-panel{display:none;}
.sub-panel.active{display:block;}
</style>
</head>
<body>
<div class="shell">

  <!-- 桌面版左側選單 -->
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 12c2-4 6-7 11-7 3 0 5.5 1.2 7 3-1 .3-2 1-2 2.5 0 1 .6 1.8 1.5 2.2-1.2 1.7-3.6 3-6.5 3-2 3-5.5 4.3-9 3.3 1.5-1 2.5-2.3 2.8-3.8C5.8 14.8 4 13.6 3 12Z" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="16.3" cy="9.4" r="0.9" fill="white"/>
        </svg>
      </div>
      <div class="sb-brand-text">
        <h1>白蝦採購工具箱</h1>
        <p>PRAWN TOOLKIT</p>
      </div>
    </div>

    <div class="sb-fx-badge" id="fxBadge">
      <span class="live-dot off" id="fxDot"></span>
      <span id="fxBadgeText">匯率載入中…</span>
    </div>

    <nav class="sb-nav" id="sbNav"></nav>

    <p class="sb-footer-note">公式皆於各計算器上方標示，數值僅供採購參考，實際交易請依供應商報價與報關資料核實。</p>
  </aside>

  <!-- 手機版頂部選單 -->
  <div class="mobile-topbar">
    <div class="mt-brand">
      <div class="mt-brand-left">
        <div class="mt-brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 12c2-4 6-7 11-7 3 0 5.5 1.2 7 3-1 .3-2 1-2 2.5 0 1 .6 1.8 1.5 2.2-1.2 1.7-3.6 3-6.5 3-2 3-5.5 4.3-9 3.3 1.5-1 2.5-2.3 2.8-3.8C5.8 14.8 4 13.6 3 12Z" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
            <circle cx="16.3" cy="9.4" r="0.9" fill="white"/>
          </svg>
        </div>
        <div class="mt-brand-text"><h1>白蝦採購工具箱</h1></div>
      </div>
      <div class="mt-fx-badge" id="fxBadgeMobile">
        <span class="live-dot off" id="fxDotMobile"></span>
        <span id="fxBadgeTextMobile">載入中…</span>
      </div>
    </div>
    <nav class="mt-tabs" id="mtNav"></nav>
  </div>

  <main class="main-wrap" id="panelHost"></main>

</div>

<script>
/* =========================================================
   白蝦採購工具箱 — 完整版（10個工具）
   修正：匯率API三來源備援
   新增：07周轉天數 08重量換算 09裝櫃計算 10賣價反推USD
   ========================================================= */

const TABS = [
  { id:"margin",   num:"01", label:"毛利率計算器" },
  { id:"fx",       num:"02", label:"匯率換算器" },
  { id:"percent",  num:"03", label:"百分比計算器" },
  { id:"spec",     num:"04", label:"白蝦規格換算" },
  { id:"cost",     num:"05", label:"採購成本＋毛利" },
  { id:"ice",      num:"06", label:"包冰率計算器" },
  { id:"turnover", num:"07", label:"周轉天數" },
  { id:"weight",   num:"08", label:"重量單位換算" },
  { id:"container",num:"09", label:"裝櫃計算器" },
  { id:"reverse",  num:"10", label:"賣價反推USD成本" },
];

let state = {
  fxRates: null,
  fxLoading: false,
};

/* ---------------- Tab / Panel scaffold ---------------- */
function buildTabs(){
  const sbNav = document.getElementById("sbNav");
  const mtNav = document.getElementById("mtNav");
  sbNav.innerHTML = TABS.map((t,i)=>`
    <button class="sb-tab-btn${i===0?' active':''}" data-tab="${t.id}">
      <span class="tab-num">${t.num}</span>${t.label}
    </button>`).join("");
  mtNav.innerHTML = TABS.map((t,i)=>`
    <button class="mt-tab-btn${i===0?' active':''}" data-tab="${t.id}">
      <span class="tab-num">${t.num}</span>${t.label}
    </button>`).join("");
  [...sbNav.querySelectorAll(".sb-tab-btn"), ...mtNav.querySelectorAll(".mt-tab-btn")].forEach(btn=>{
    btn.addEventListener("click", ()=> switchTab(btn.dataset.tab));
  });
}

function switchTab(id){
  document.querySelectorAll(".sb-tab-btn, .mt-tab-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===id);
  });
  document.querySelectorAll(".panel").forEach(p=>{
    p.classList.toggle("active", p.id === "panel-"+id);
  });
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
}

function buildPanels(){
  const host = document.getElementById("panelHost");
  host.innerHTML = `
    <section class="panel active" id="panel-margin">${marginPanelHTML()}</section>
    <section class="panel" id="panel-fx">${fxPanelHTML()}</section>
    <section class="panel" id="panel-percent">${percentPanelHTML()}</section>
    <section class="panel" id="panel-spec">${specPanelHTML()}</section>
    <section class="panel" id="panel-cost">${costPanelHTML()}</section>
    <section class="panel" id="panel-ice">${icePanelHTML()}</section>
    <section class="panel" id="panel-turnover">${turnoverPanelHTML()}</section>
    <section class="panel" id="panel-weight">${weightPanelHTML()}</section>
    <section class="panel" id="panel-container">${containerPanelHTML()}</section>
    <section class="panel" id="panel-reverse">${reversePanelHTML()}</section>
  `;
}

/* ---------------- helpers ---------------- */
function fmt(num, digits=2){
  if(num===null||num===undefined||isNaN(num)) return "—";
  return Number(num).toLocaleString("zh-TW",{maximumFractionDigits:digits,minimumFractionDigits:0});
}
function fmtFull(num, digits=4){
  if(num===null||num===undefined||isNaN(num)) return "—";
  return Number(num).toFixed(digits);
}
function $(sel, scope=document){ return scope.querySelector(sel); }
function $all(sel, scope=document){ return [...scope.querySelectorAll(sel)]; }

/* =========================================================
   1. 毛利率計算器
   ========================================================= */
function marginPanelHTML(){
  return `
    <div class="panel-head"><h2>毛利率計算器</h2><p>輸入售價與成本，立即算出毛利率與毛利金額。</p></div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>毛利率 Gross Margin</div>
      <div class="formula-tag">
        <span class="fname">公式</span><br>
        毛利率 (%) ＝ <b>(售價－成本) ÷ 售價</b> × 100%
      </div>
      <div class="grid grid-2">
        <div class="field"><label>售價（每單位）</label><input type="number" id="m_price" placeholder="例如 250" step="0.01"></div>
        <div class="field"><label>成本（每單位）</label><input type="number" id="m_cost" placeholder="例如 180" step="0.01"></div>
      </div>
      <div class="result-box">
        <div class="result-row"><span class="rlabel">毛利金額（售價－成本）</span><span class="rvalue" id="m_profit">—</span></div>

function wireMarginPanel(){

    const p=parseFloat(price.value), c=parseFloat(cost.value);
    if(isNaN(p)||isNaN(c)||p===0){$("#m_profit").textContent="—";$("#m_rate").textContent="—";$("#m_costratio").textContent="—";return;}
    $("#m_profit").textContent=fmt(p-c)+" 元";
    $("#m_rate").textContent=fmt(((p-c)/p)*100)+" %";
    $("#m_costratio").textContent=fmt((c/p)*100)+" %";
  }
  [price,cost].forEach(el=>el.addEventListener("input",calc));
  const c2=$("#m2_cost"), t2=$("#m2_target");
  function calc2(){
    const cost=parseFloat(c2.value), target=parseFloat(t2.value);
    if(isNaN(cost)||isNaN(target)||target>=100){$("#m2_price").textContent="—";$("#m2_profit").textContent="—";return;}
    const price=cost/(1-target/100);
    $("#m2_price").textContent=fmt(price)+" 元";
    $("#m2_profit").textContent=fmt(price-cost)+" 元";
  }
  [c2,t2].forEach(el=>el.addEventListener("input",calc2));
}

async function fetchFxRates(){
  state.fxLoading = true;
  updateFxBadge();
  let lastErr = "";
  for(const src of FX_SOURCES){
    try{
      const resp = await fetch(src.url);
      if(!resp.ok){ lastErr=`${src.name} HTTP ${resp.status}`; continue; }
      const data = await resp.json();
      const parsed = src.parse(data);
      if(!parsed.rates||!parsed.rates.TWD){ lastErr=`${src.name} 無TWD資料`; continue; }
      state.fxRates = { rates:parsed.rates, date:parsed.date, source:src.name, manual:false };
      state.fxLoading = false;
      updateFxBadge(true);
      renderFxQuickTable(); recalcFx();
      const box=document.getElementById("fx_error_box");
      if(box) box.style.display="none";
      return;
    }catch(e){ lastErr=`${src.name}: ${e.message||e}`; }
  }
  state.fxLoading = false;
  updateFxBadge(false, true);
  const box=document.getElementById("fx_error_box");
  const det=document.getElementById("fx_error_detail");
  if(box) box.style.display="block";
  if(det) det.textContent=lastErr;
}

function updateFxBadge(success, failed){
  const els = [
  [document.getElementById("fxDot"), document.getElementById("fxBadgeText")],
    [document.getElementById("fxDotMobile"), document.getElementById("fxBadgeTextMobile")],
  ];
  let cls, msg, msgMobile;
  if(state.fxLoading){ cls="live-dot off"; msg="匯率載入中…"; msgMobile="載入中…"; }
  else if(failed){ cls="live-dot off"; msg="抓取失敗，請見說明"; msgMobile="抓取失敗"; }
  else if(state.fxRates?.manual){ cls="live-dot off"; msg="手動輸入匯率"; msgMobile="手動匯率"; }
  else{ cls="live-dot"; msg=`已連線(${state.fxRates?.source}) · ${state.fxRates?.date||""}`; msgMobile="已連線"; }
  const [[dot,txt],[dotM,txtM]]=els;
  if(dot)dot.className=cls; if(txt)txt.textContent=msg;
  if(dotM)dotM.className=cls; if(txtM)txtM.textContent=msgMobile;
}

function convertFx(amount, from, to){
  if(!state.fxRates) return null;
  const r=state.fxRates.rates;
  if(r[from]===undefined||r[to]===undefined) return null;
  return (amount/r[from])*r[to];
}
function recalcFx(){
  const amount=parseFloat($("#fx_amount").value);
  const from=$("#fx_from").value, to=$("#fx_to").value;
  $("#fx_result_label").textContent=`${amount||0} ${from} ＝`;
  if(!state.fxRates||isNaN(amount)){
    $("#fx_result").textContent="—";$("#fx_rate_line").textContent="—";$("#fx_ts").textContent="—"; return;
  }
  $("#fx_result").textContent=fmt(convertFx(amount,from,to))+" "+to;
  $("#fx_rate_line").textContent=`1 ${from} ＝ ${fmtFull(convertFx(1,from,to),4)} ${to}`;
  $("#fx_ts").textContent=`${state.fxRates.source||""} · ${state.fxRates.date||""}`;
}
function renderFxQuickTable(){
  const tbody=$("#fx_quick_table tbody");
  if(!state.fxRates) return;
  const r=state.fxRates.rates, twd=r["TWD"];
  if(!twd){ tbody.innerHTML=`<tr><td colspan="3">無TWD資料</td></tr>`; return; }
  tbody.innerHTML=FX_COMMON.filter(c=>c!=="TWD").map(c=>{
    if(!r[c]) return "";
    const rate=twd/r[c];
    return `<tr><td class="label-cell">${c}</td><td>${fmtFull(rate,4)}</td><td>${fmt(rate*1000)} 元</td></tr>`;
  }).join("");
}
function wireFxPanel(){
  $("#fx_amount").addEventListener("input", recalcFx);
  $("#fx_from").addEventListener("change", recalcFx);
  $("#fx_to").addEventListener("change", recalcFx);
  $("#fx_from").value="USD"; $("#fx_to").value="TWD";
  $("#fx_swap").addEventListener("click",()=>{
    const f=$("#fx_from").value, t=$("#fx_to").value;
    $("#fx_from").value=t; $("#fx_to").value=f; recalcFx();
  });
  $("#fx_refresh").addEventListener("click", fetchFxRates);
  $("#fx_manual_apply").addEventListener("click",()=>{
    const v=parseFloat($("#fx_manual_rate").value);
    if(isNaN(v)||v<=0){ alert("請輸入有效匯率"); return; }
    state.fxRates={ rates:{USD:1, TWD:v}, date:"手動輸入", source:"手動", manual:true };
    updateFxBadge(); renderFxQuickTable(); recalcFx();
    const box=document.getElementById("fx_error_box");
    if(box) box.style.display="none";
  });
}

function wireSpecPanel(){
  const panel = document.getElementById("panel-spec");
  $all(".sub-tab-btn", panel).forEach(btn=>{
    btn.addEventListener("click",()=>{
      $all(".sub-tab-btn",panel).forEach(b=>b.classList.toggle("active",b===btn));
      $all(".sub-panel",panel).forEach(p=>p.classList.toggle("active",p.id==="sub-"+btn.dataset.sub));
      runSpec();
    });
  });
  function calcSpec(min,max,w){
    if(isNaN(min)||isNaN(max)||isNaN(w)||min<=0||max<=0){$("#s_perweight").textContent="—";$("#s_countrange").textContent="—";return;}
    const heavy=(1000/min).toFixed(1), light=(1000/max).toFixed(1);
    const lo=(w*min/1000).toFixed(4), hi=(w*max/1000).toFixed(4);
    $("#s_perweight").textContent=`${light}–${heavy} g / 隻`;
    $("#s_countrange").textContent=`${lo}–${hi} 尾`;
  }
  function runSpec(){
    const activeSub=$(".sub-tab-btn.active",panel).dataset.sub;
    if(activeSub==="preset"){
      const [min,max]=$("#s_preset_select").value.split("-").map(Number);
      calcSpec(min,max,parseFloat($("#s_preset_weight").value));
    }else{
      calcSpec(parseFloat($("#s_custom_min").value),parseFloat($("#s_custom_max").value),parseFloat($("#s_custom_weight").value));
    }
  }
  ["#s_preset_select","#s_preset_weight"].forEach(s=>$(s).addEventListener("input",runSpec));
  $("#s_preset_select").addEventListener("change",runSpec);
  ["#s_custom_min","#s_custom_max","#s_custom_weight"].forEach(s=>$(s).addEventListener("input",runSpec));
  runSpec();
}

function wireCostPanel(){
  const usd=$("#c_usd"), fxr=$("#c_fxrate"), price=$("#c_price"), cfm=$("#c_cost_for_margin");
  let manualEdit=false;
  function getTariff(){ return parseFloat(document.querySelector('input[name="c_tariff"]:checked').value); }
  function updateChips(){
    document.getElementById("c_tariff15_wrap").classList.toggle("checked",document.getElementById("c_tariff15").checked);
    document.getElementById("c_tariff20_wrap").classList.toggle("checked",document.getElementById("c_tariff20").checked);
  }
  $all('input[name="c_tariff"]').forEach(r=>r.addEventListener("change",()=>{updateChips();calcCost();}));
  updateChips();
  function calcCost(){
    const u=parseFloat(usd.value), fx=parseFloat(fxr.value), t=getTariff();
    if(isNaN(u)||isNaN(fx)){$("#c_step1").textContent="—";$("#c_step2").textContent="—";$("#c_final").textContent="—";return;}
    const s1=u*1.0045*(1+t)*fx, s2=s1+3, fin=s2*1.05;
    $("#c_step1").textContent=fmt(s1)+" 元";
    $("#c_step2").textContent=fmt(s2)+" 元";
    $("#c_final").textContent=fmt(fin)+" 元";
    if(!manualEdit){ cfm.value=fin.toFixed(2); calcMargin(); }
  }
  [usd,fxr].forEach(el=>el.addEventListener("input",calcCost));
  calcCost();
  $("#c_use_fx").addEventListener("click",()=>{
    if(state.fxRates?.rates?.TWD){ fxr.value=fmtFull(state.fxRates.rates.TWD,4); calcCost(); }
    else alert("即時匯率尚未載入，請切至匯率換算器分頁重新抓取。");
  });
  function calcMargin(){
    const c=parseFloat(cfm.value), p=parseFloat(price.value);
    if(isNaN(c)||isNaN(p)||p===0){$("#c_margin_profit").textContent="—";$("#c_margin_rate").textContent="—";return;}
    $("#c_margin_profit").textContent=fmt(p-c)+" 元";
    $("#c_margin_rate").textContent=fmt(((p-c)/p)*100)+" %";
  }
  cfm.addEventListener("input",()=>{manualEdit=true;calcMargin();});
  price.addEventListener("input",calcMargin);
  $("#c_reset_auto").addEventListener("click",()=>{manualEdit=false;calcCost();});
}

function wireTurnoverPanel(){

function wireWeightPanel(){
  const CONV = { kg:1, lb:1/0.453592, jin:2, tael:1/0.6, g:1000, mt:0.001, oz:1/0.0283495, liang:1/0.0375 };
  const fields = ["kg","lb","jin","tael","g","mt","oz","liang"];
  function calcFrom(srcId){
    const val = parseFloat($("#wt_"+srcId).value);
    if(isNaN(val)){ fields.filter(f=>f!==srcId).forEach(f=>$("#wt_"+f).value=""); return; }
    const kg = val / CONV[srcId];
    fields.filter(f=>f!==srcId).forEach(f=>{
      const v = kg * CONV[f];
      $("#wt_"+f).value = v < 0.001 ? v.toFixed(8).replace(/\.?0+$/,"") : parseFloat(v.toFixed(6));
    });
  }
  fields.forEach(id=>$("#wt_"+id).addEventListener("input",()=>calcFrom(id)));
}

  function calcLoose(){
    const {L,W,effH,hr}=getDims();
    const bL=parseFloat($("#ct_bL").value), bW=parseFloat($("#ct_bW").value), bH=parseFloat($("#ct_bH").value);
    $("#ct_eff_h").textContent=`${effH} cm（高${getDims().H} cm − 預留${hr} cm）`;

    if(isNaN(bL)||isNaN(bW)||isNaN(bH)||bL<=0||bW<=0||bH<=0){
      ["ct_best_orient","ct_breakdown","ct_total_boxes"].forEach(id=>$(("#"+id)).textContent="—");
      document.getElementById("ct_overheight_warn").style.display="none"; return;
    }
    // 箱子保持正放：只允許 L↔W 對調，H 固定不參與旋轉
    const orientations=[
      [bL,bW,bH],  // 方向A：原始（箱長沿櫃長，箱寬沿櫃寬）
      [bW,bL,bH],  // 方向B：L與W對調（箱寬沿櫃長，箱長沿櫃寬）
    ];
    let best=0, bestO=null, bestBreak=null, bestLabel="";
    let anyFits=false;
    orientations.forEach(([l,w,h],idx)=>{
      if(h>effH) return;
      anyFits=true;
      const nL=Math.floor(L/l), nW=Math.floor(W/w), nH=Math.floor(effH/h);
      const cnt=nL*nW*nH;
      if(cnt>best){ best=cnt; bestO=[l,w,h]; bestBreak=[nL,nW,nH]; bestLabel=idx===0?"方向A（原始：L×W）":"方向B（對調：W×L）"; }
    });
    if(!anyFits){
      document.getElementById("ct_overheight_warn").style.display="block";
      ["ct_best_orient","ct_breakdown","ct_total_boxes"].forEach(id=>$("#"+id).textContent="無法裝載");
      return;
    }
    document.getElementById("ct_overheight_warn").style.display="none";
    $("#ct_best_orient").textContent=`${bestLabel}　${bestO[0]} × ${bestO[1]} × ${bestO[2]} cm`;
    $("#ct_breakdown").textContent=`${bestBreak[0]} × ${bestBreak[1]} × ${bestBreak[2]} ＝ ${best} 箱`;
    $("#ct_total_boxes").textContent=fmt(best,0)+" 箱";
  }

  function calcPallet(){
    const {L,W,effH,hr}=getDims();
    const pH=parseFloat($("#ct_pH").value)||0, cargoH=parseFloat($("#ct_cargoH").value)||0;
    const pL=parseFloat($("#ct_pL").value), pW=parseFloat($("#ct_pW").value);
    const totalPH=pH+cargoH;
    const effHv=effH;
    $("#ct_peff_h").textContent=`${effHv} cm`;
    $("#ct_pallet_total_h").textContent=isNaN(totalPH)||totalPH===0?"—":`${totalPH} cm（板 ${pH}+貨 ${cargoH}）`;
    if(isNaN(pL)||isNaN(pW)||totalPH===0){
      ["ct_pallet_floor","ct_pallet_layers","ct_total_pallets"].forEach(id=>$("#"+id).textContent="—");
      document.getElementById("ct_pallet_warn").style.display="none"; return;
    }
    if(totalPH>effHv){
      document.getElementById("ct_pallet_warn").style.display="block";
      ["ct_pallet_floor","ct_pallet_layers","ct_total_pallets"].forEach(id=>$("#"+id).textContent="無法裝載"); return;
    }
    document.getElementById("ct_pallet_warn").style.display="none";
    const floor=Math.floor(L/pL)*Math.floor(W/pW);
    const layers=Math.floor(effHv/totalPH);
    const total=floor*layers;
    $("#ct_pallet_floor").textContent=`${Math.floor(L/pL)} × ${Math.floor(W/pW)} ＝ ${floor} 板`;
    $("#ct_pallet_layers").textContent=`${layers} 層`;
    $("#ct_total_pallets").textContent=fmt(total,0)+" 板";
  }

  function runCalc(){
    const mode=$("#ct_mode").value;
    document.getElementById("ct_loose_card").style.display=mode==="loose"?"block":"none";
    document.getElementById("ct_pallet_card").style.display=mode==="pallet"?"block":"none";
    if(mode==="loose") calcLoose(); else calcPallet();
  }

  $("#ct_type").addEventListener("change",()=>{
    document.getElementById("ct_custom_dims").style.display=$("#ct_type").value==="custom"?"block":"none";
    runCalc();
  });
  $("#ct_headroom").addEventListener("change",runCalc);
  $("#ct_mode").addEventListener("change",runCalc);
  ["ct_cL","ct_cW","ct_cH","ct_bL","ct_bW","ct_bH","ct_pL","ct_pW","ct_pH","ct_cargoH"].forEach(id=>$(("#"+id)).addEventListener("input",runCalc));
  runCalc();
}

/* =========================================================
   10. 賣價反推USD採購成本
   公式：USD = 售價×(1-毛利率) ÷ (1.01×1.0045×(1+關稅率)×匯率×1.05)
   1.01=內陸雜費, 1.0045=港務稅捐, 1.05=營業稅
   ========================================================= */
function reversePanelHTML(){
  return `
    <div class="panel-head"><h2>賣價反推 USD 採購成本</h2><p>已知台幣售價與目標毛利率，反推最高可接受的美金採購成本。</p></div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>反推 USD 採購成本</div>
      <div class="formula-tag"><span class="fname">公式</span><br>
        USD成本 ＝ 售價 × (1－毛利率) ÷ (1.01 × 1.0045 × (1＋關稅率) × 匯率 × 1.05)<br>
        <span style="color:#8AA0A4">1.01＝內陸雜費、1.0045＝港務稅捐、1.05＝營業稅</span>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>台幣售價</label><input type="number" id="rv_sell" placeholder="例如 1300" step="0.01"></div>
        <div class="field"><label>目標毛利率（%）</label><input type="number" id="rv_margin" placeholder="例如 20" step="0.1"></div>
        <div class="field"><label>匯率（USD → TWD）</label><input type="number" id="rv_fx" placeholder="例如 31.5" step="0.0001"><span class="hint">可切換至匯率換算器查詢即時匯率</span></div>
        <div class="field"><label><br>關稅率</label>
          <div class="radio-row">
            <label class="radio-chip" id="rv_t15_wrap"><input type="radio" name="rv_tariff" id="rv_t15" value="0.15" checked>15%</label>
            <label class="radio-chip" id="rv_t20_wrap"><input type="radio" name="rv_tariff" id="rv_t20" value="0.20">20%</label>
          </div>
        </div>
      </div>
      <div style="margin-top:8px;"><button class="ghost-btn" id="rv_use_fx">套用即時匯率</button></div>
      <div class="result-box" style="margin-top:16px;">
        <div class="result-row"><span class="rlabel">台幣目標成本（售價×(1−毛利率)）</span><span class="rvalue muted" id="rv_twd_cost">—</span></div>
        <div class="result-row"><span class="rlabel">除數（1.01×1.0045×(1+關稅)×匯率×1.05）</span><span class="rvalue muted" id="rv_divisor">—</span></div>
        <div class="result-row"><span class="rlabel">最高可接受 USD 採購成本</span><span class="rvalue big" id="rv_usd">—</span></div>
      </div>
      <p class="note-line">注意：此公式未含採購成本公式中的「+3元固定費用」，為簡化計算的估算版本，適合快速評估報價合理性。若需精確計算請使用第05項「採購成本＋毛利」計算器正向核對。</p>
    </div>`;
}
function wireReversePanel(){
  function updateChips(){
    document.getElementById("rv_t15_wrap").classList.toggle("checked",document.getElementById("rv_t15").checked);
    document.getElementById("rv_t20_wrap").classList.toggle("checked",document.getElementById("rv_t20").checked);
  }
  $all('input[name="rv_tariff"]').forEach(r=>r.addEventListener("change",()=>{updateChips();calc();}));
  updateChips();
  function calc(){
    const sell=parseFloat($("#rv_sell").value), margin=parseFloat($("#rv_margin").value);
    const fx=parseFloat($("#rv_fx").value);
    const tariff=parseFloat(document.querySelector('input[name="rv_tariff"]:checked').value);
    if(isNaN(sell)||isNaN(margin)||isNaN(fx)){
      $("#rv_twd_cost").textContent="—"; $("#rv_divisor").textContent="—"; $("#rv_usd").textContent="—"; return;
    }
    const twdCost=sell*(1-margin/100);
    const divisor=1.01*1.0045*(1+tariff)*fx*1.05;
    const usd=twdCost/divisor;
    $("#rv_twd_cost").textContent=fmt(twdCost)+" 元";
    $("#rv_divisor").textContent=fmtFull(divisor,4);
    $("#rv_usd").textContent=fmtFull(usd,4)+" USD";
  }
  ["#rv_sell","#rv_margin","#rv_fx"].forEach(s=>$(s).addEventListener("input",calc));
  $("#rv_use_fx").addEventListener("click",()=>{
    if(state.fxRates?.rates?.TWD){ $("#rv_fx").value=fmtFull(state.fxRates.rates.TWD,4); calc(); }
    else alert("即時匯率尚未載入，請切至匯率換算器分頁重新抓取。");
  });
}
